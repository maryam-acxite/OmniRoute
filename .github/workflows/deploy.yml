name: Build and Auto-Deploy

on:
  push:
    branches:
      - "main"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Official Image & Re-tag
        run: |
          docker pull ghcr.io/diegosouzapw/omniroute:latest
          docker tag ghcr.io/diegosouzapw/omniroute:latest ghcr.io/maryam-acxite/omniroute:latest
          docker push ghcr.io/maryam-acxite/omniroute:latest

      - name: Trigger Dokploy Deployment
        run: |
          curl -X POST "${{ secrets.DOKPLOY_WEBHOOK_URL }}"
